server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://${CONFIG_SERVER_USERNAME:config}:${CONFIG_SERVER_PASSWORD:change-config-password}@localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/public/hosts/**,/api/v1/admin/employees/**
            - id: visitor-service
              uri: lb://visitor-service
              predicates:
                - Path=/api/v1/public/visits/**,/api/v1/host/visits/**,/api/v1/admin/visits/**,/api/v1/admin/dashboard,/api/v1/reception/visits/**
            - id: pass-service
              uri: lb://pass-service
              predicates:
                - Path=/api/v1/public/passes/**,/api/v1/reception/passes/**,/api/v1/admin/passes/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/admin/notifications/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type, X-Request-Id]
                exposedHeaders: [Location, X-Request-Id]
                allowCredentials: true
                maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:change-eureka-password}@localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}

app:
  jwt:
    issuer: ${APP_JWT_ISSUER:visitor-fastpass}
    secret: ${APP_JWT_SECRET:change-this-development-secret-32-bytes-minimum}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
