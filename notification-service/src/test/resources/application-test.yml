spring:
  config.import: ""
  datasource:
    url: jdbc:h2:mem:notifications;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa.hibernate.ddl-auto: create-drop
  flyway.enabled: false
  kafka.listener.auto-startup: false
eureka.client.enabled: false
app:
  jwt:
    issuer: visitor-fastpass-test
    secret: test-secret-that-is-at-least-thirty-two-bytes-long
  kafka.topics.pass-generated: visitor.pass-generated.test
  mail:
    enabled: false
    from-address: no-reply@test.local
